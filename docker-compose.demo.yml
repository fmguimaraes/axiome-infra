# ─────────────────────────────────────────────────────────────────────────────
# LOCAL STACK — main code, the ONE DB (APHM / Biotech One data), fixed ports, fast.
#
# Runs the MAIN branch (the primary checkouts) against the single shared DB on the
# `axiome-localhost` container — which has been migrated forward to main's schema,
# so main code runs on the real APHM data. Fixed reserved host ports: front 5173,
# API 3000, biocompute 8000.
#
# FAST + "use whatever node_modules is already there": each app mounts the primary
# checkout and uses ITS on-disk node_modules directly (no empty volume overlaid on
# top, which is what forced a reinstall on every start). `npm install` runs ONLY if
# node_modules is genuinely missing, so a normal start goes straight to `npm run dev`.
#
#   Start:  make demo-up        (docker compose -p axiome-demo -f docker-compose.demo.yml up -d)
#   Stop:   make demo-down      (stop; next start is instant)
#   Logs:   make demo-logs
#
# Requires the shared stack (mongo/redis/rabbitmq/minio) + the axiome-localhost DB
# already running on the external `axiome-shared-net` network.
#
# Login:  admin@cro-one.com / admin   →  http://localhost:5173
# ─────────────────────────────────────────────────────────────────────────────

networks:
  shared:
    external: true
    name: axiome-shared-net

services:
  backend:
    # GLIBC image (Debian) — the mounted primary-checkout node_modules is glibc-built
    # (bcrypt has only a glibc native binding; sharp/prisma carry glibc engines), so it
    # loads as-is here. On alpine/musl bcrypt segfaults (SIGSEGV/139) at admin bootstrap.
    # This is what lets us reuse the on-disk node_modules with NO reinstall.
    image: node:20-slim
    container_name: axiome-demo-backend
    working_dir: /app
    # No node_modules volume — use the primary checkout's own on-disk node_modules.
    # openssl (for Prisma) is ensured only if absent; npm install runs only if the
    # checkout has no node_modules. Normal start = straight to `npm run dev`.
    command: sh -c "command -v openssl >/dev/null 2>&1 || (apt-get update >/dev/null 2>&1 && apt-get install -y --no-install-recommends openssl >/dev/null 2>&1) || true; [ -x node_modules/.bin/nest ] || npm install; npm run dev"
    restart: unless-stopped
    networks: [shared]
    ports:
      - "3000:3000"
    volumes:
      - /home/felipe/dev/axiome/axiome-global/axiome-back:/app     # MAIN (primary checkout)
    environment:
      NODE_ENV: development
      PORT: "3000"
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      # ── THE ONE DB — APHM / Biotech One data, on the axiome-localhost container ──
      DATABASE_URL: postgresql://axiome:axiome_local_dev@axiome-localhost:5432/axiome
      USER_DATABASE_URL: postgresql://axiome:axiome_local_dev@axiome-localhost:5432/axiome?schema=user_svc
      ORGANIZATION_DATABASE_URL: postgresql://axiome:axiome_local_dev@axiome-localhost:5432/axiome?schema=organization_svc
      # ── the one shared Mongo / Redis / RabbitMQ / MinIO ──
      MONGODB_URL: mongodb://axiome:axiome_local_dev@mongodb:27017/axiome-global-axi-1233?authSource=admin&directConnection=true
      RABBITMQ_URL: amqp://axiome:axiome_local_dev@rabbitmq:5672/axiome-global-axi-1233
      REDIS_URL: redis://redis:6379/1
      REDIS_PREFIX: "axiome:shared:"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: axiome-global-axi-1233-uploads
      S3_BUCKET_UPLOADS: axiome-global-axi-1233-uploads
      S3_BUCKET_ARTIFACTS: axiome-global-axi-1233-artifacts
      S3_BUCKET_SYSTEM: axiome-global-axi-1233-system
      S3_REGION: eu-west-3
      S3_FORCE_PATH_STYLE: "true"
      BIO_COMPUTE_URL: http://axiome-demo-biocompute:8000
      CALLBACK_BASE_URL: http://axiome-demo-backend:3004
      JWT_SECRET: local-dev-jwt-secret-change-in-production
      # Optional verbosity knobs — default off; `make local-debug` sets them.
      LOG_LEVEL: ${LOG_LEVEL:-}
      DEBUG: ${DEBUG:-}
      NODE_OPTIONS: ${NODE_OPTIONS:-}
      BOOTSTRAP_ADMIN_EMAIL: admin@axiome.local
      BOOTSTRAP_ADMIN_PASSWORD: admin
      BOOTSTRAP_ADMIN_FIRST_NAME: Local
      BOOTSTRAP_ADMIN_LAST_NAME: Admin

  biocompute:
    image: axiome-axiome-global-axi-1233-biocompute
    container_name: axiome-demo-biocompute
    working_dir: /app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks: [shared]
    ports:
      - "8000:8000"
    volumes:
      - /home/felipe/dev/axiome/axiome-global/axiome-bio-compute:/app   # MAIN (primary checkout)
    environment:
      BIO_COMPUTE_S3_ENDPOINT_URL: http://minio:9000
      BIO_COMPUTE_S3_ACCESS_KEY: minioadmin
      BIO_COMPUTE_S3_SECRET_KEY: minioadmin
      BIO_COMPUTE_S3_BUCKET: axiome-global-axi-1233-artifacts
      BIO_COMPUTE_DASHBOARD_DB_URL: postgresql://axiome:axiome_local_dev@axiome-localhost:5432/axiome
      BIO_COMPUTE_JWT_SECRET: local-dev-jwt-secret-change-in-production
      BIO_COMPUTE_LOG_LEVEL: ${BIO_COMPUTE_LOG_LEVEL:-INFO}
      BIO_COMPUTE_PORT: "8000"

  frontend:
    image: node:20-slim   # glibc — matches the host-built node_modules (esbuild/rollup gnu binaries)
    container_name: axiome-demo-frontend
    working_dir: /app
    command: sh -c "[ -x node_modules/.bin/vite ] || npm install; npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped
    networks: [shared]
    ports:
      - "5173:5173"
    volumes:
      - /home/felipe/dev/axiome/axiome-global/axiome-front:/app     # MAIN (primary checkout)
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
      VITE_GATEWAY_WS_URL: http://localhost:3000
      VITE_BIOCOMPUTE_URL: http://localhost:8000
