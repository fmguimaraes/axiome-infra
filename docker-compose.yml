# Per-worktree APPLICATION stack — one per agent/worktree.
#
# ONLY the services under active development (backend, biocompute, frontend).
# The stateful commodity services (postgres/mongodb/redis/rabbitmq/minio) are
# SHARED and defined in docker-compose.shared.yml (project axiome-shared).
#
# Compose project name: axiome-<slug>   (scripts pass `-p axiome-<slug>`)
# Slug + all per-worktree values come from the gitignored `.env` that
# scripts/wt-up.sh writes. Bring this stack up / down ONLY through the scripts:
#   scripts/wt-up.sh        scripts/wt-down.sh        scripts/wt-status.sh
# They enforce the project name; a bare `docker compose up` here would collide
# on the default project name (the directory) with every other worktree.
#
# NOTHING in this file pins a container_name or a literal host port — container
# names are namespaced by the project (axiome-<slug>-backend-1, ...) and every
# published port is `${BACKEND_PORT}` etc., which wt-up.sh computes as
# base + PORT_OFFSET so two worktrees never publish the same host port.
services:
  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache openssl chromium nss freetype harfbuzz ca-certificates ttf-freefont && npm install && npm run dev"
    environment:
      NODE_ENV: development
      PORT: "3000"
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      # --- Postgres: this worktree's own database on the SHARED instance ---
      DATABASE_URL: postgresql://${POSTGRES_USER:-axiome}:${POSTGRES_PASSWORD:-axiome_local_dev}@postgres:5432/${POSTGRES_DB}
      USER_DATABASE_URL: postgresql://${POSTGRES_USER:-axiome}:${POSTGRES_PASSWORD:-axiome_local_dev}@postgres:5432/${POSTGRES_DB}?schema=user_svc
      ORGANIZATION_DATABASE_URL: postgresql://${POSTGRES_USER:-axiome}:${POSTGRES_PASSWORD:-axiome_local_dev}@postgres:5432/${POSTGRES_DB}?schema=organization_svc
      # --- Mongo: this worktree's own event-store database ---
      MONGODB_URL: mongodb://${MONGODB_USER:-axiome}:${MONGODB_PASSWORD:-axiome_local_dev}@mongodb:27017/${MONGODB_DB}?authSource=admin&directConnection=true
      # --- RabbitMQ: this worktree's own vhost ---
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-axiome}:${RABBITMQ_PASSWORD:-axiome_local_dev}@rabbitmq:5672/${RABBITMQ_VHOST}
      # --- Redis: this worktree's own logical DB index (+ reserved key prefix) ---
      REDIS_URL: redis://redis:6379/${REDIS_DB_INDEX}
      REDIS_PREFIX: ${REDIS_PREFIX}
      # --- Object store: shared endpoint, this worktree's own bucket set ---
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # Browser-facing presigned URLs must use the published host — the browser
      # can't resolve the in-Docker `minio` hostname.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      # Backend uses ONE bucket (S3_BUCKET, falling back to S3_BUCKET_UPLOADS);
      # artifacts/system are key-prefixes inside it. Set both to the worktree bucket.
      S3_BUCKET: ${S3_BUCKET}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS}
      S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS}
      S3_BUCKET_SYSTEM: ${S3_BUCKET_SYSTEM}
      S3_REGION: ${S3_REGION:-eu-west-3}
      S3_FORCE_PATH_STYLE: "true"
      # App-to-app calls use slug-scoped hostnames (unique on the shared net).
      BIO_COMPUTE_URL: http://biocompute-${WT_SLUG}:8000
      CALLBACK_BASE_URL: http://backend-${WT_SLUG}:3004
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-in-production}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@axiome.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin}
      BOOTSTRAP_ADMIN_FIRST_NAME: ${BOOTSTRAP_ADMIN_FIRST_NAME:-Local}
      BOOTSTRAP_ADMIN_LAST_NAME: ${BOOTSTRAP_ADMIN_LAST_NAME:-Admin}
    ports:
      - "${BACKEND_PORT}:3000"
    volumes:
      - ${BACKEND_SRC:-../axiome-back}:/app
      - backend_node_modules:/app/node_modules
    networks:
      axiome-shared-net:
        aliases:
          - backend-${WT_SLUG}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  biocompute:
    build:
      context: ${BIOCOMPUTE_SRC:-../axiome-bio-compute}
      dockerfile: Dockerfile
    working_dir: /app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      BIO_COMPUTE_LOG_LEVEL: ${BIOCOMPUTE_LOG_LEVEL:-INFO}
      BIO_COMPUTE_PORT: "8000"
      BIO_COMPUTE_S3_ENDPOINT_URL: ${S3_ENDPOINT:-http://minio:9000}
      BIO_COMPUTE_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      BIO_COMPUTE_S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      BIO_COMPUTE_S3_BUCKET: ${BIO_COMPUTE_S3_BUCKET}
      BIO_COMPUTE_DASHBOARD_DB_URL: postgresql://${POSTGRES_USER:-axiome}:${POSTGRES_PASSWORD:-axiome_local_dev}@postgres:5432/${POSTGRES_DB}
      BIO_COMPUTE_JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-in-production}
    ports:
      - "${BIOCOMPUTE_PORT}:8000"
    volumes:
      - ${BIOCOMPUTE_SRC:-../axiome-bio-compute}:/app
    networks:
      axiome-shared-net:
        aliases:
          - biocompute-${WT_SLUG}

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      # Point the browser at THIS worktree's backend host port.
      VITE_API_URL: http://localhost:${BACKEND_PORT}/api/v1
      VITE_GATEWAY_WS_URL: http://localhost:${BACKEND_PORT}
      # Jobs dashboard (biocompute) — this worktree's biocompute host port.
      # NOTE: axiome-front currently hardcodes http://localhost:8000/dashboard in
      # Layout.tsx; this var is honored only once that hardcode is fixed to read
      # import.meta.env.VITE_BIOCOMPUTE_URL (reported follow-up).
      VITE_BIOCOMPUTE_URL: http://localhost:${BIOCOMPUTE_PORT}
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ${FRONTEND_SRC:-../axiome-front}:/app
      - frontend_node_modules:/app/node_modules
    networks:
      axiome-shared-net:
        aliases:
          - frontend-${WT_SLUG}

# node_modules volumes are namespaced by the compose project (axiome-<slug>_...),
# so each worktree gets its own — no cross-worktree dependency bleed.
volumes:
  backend_node_modules:
  frontend_node_modules:

# The shared services' network, created by wt-up.sh and owned by the
# axiome-shared stack. App services attach here to reach postgres/redis/minio/
# mongodb/rabbitmq by name, and to reach each other by slug-scoped alias.
networks:
  axiome-shared-net:
    external: true
    name: axiome-shared-net
