# Terraform CD — terraform plan/apply for the single live environment (production).
#
# Promotion to production is now AUTOMATIC. The service repos
# (axiome-{front,back,bio-compute}) auto-commit images.tfvars to this repo
# (staging, then production) on every push to their main. A production-affecting
# infra change — including a production images.tfvars commit — triggers this
# workflow on push.
#
# The production apply is GATED by two things, in order:
#   1. ci-gate job          — terraform fmt + validate + plan must pass (infra CI).
#   2. `production` Environment — required reviewers must approve (manual approval).
#                                 Configure under Settings → Environments → production →
#                                 "Required reviewers" in this repo. Without it, apply runs
#                                 automatically once ci-gate passes (no human gate).
#
# Only after BOTH gates does apply-production run `terraform apply`.
#
# A THIRD gate (AXI-1947, FR29/AC20) sits in both jobs: "Check data-tier
# lock" runs scripts/lock.sh production status data-tier. Exit 0 (FREE) lets
# the job continue; HELD(1) or UNDETERMINED(2) fails the step — Actions fails
# the job on any non-zero step exit by default, so no extra wrapper is
# needed. It runs AFTER "Export provider credentials" (it needs the AWS
# creds that step exports to $GITHUB_ENV) and BEFORE the terraform
# plan/apply step in EACH job — state can change while apply-production
# waits on manual approval, so it is re-checked immediately before apply,
# not just once in ci-gate. ci-gate's ordering today is:
#   checkout -> setup-terraform -> fmt -check -> validate -> export-creds ->
#   [NEW] check data-tier lock -> terraform plan
# i.e. the lock check runs AFTER fmt/validate, so while terraform-cd is red
# at `fmt` (see axiome-docs dev-epic-context "Lead notes") this check never
# runs at all — it starts running the moment fmt is fixed, in the same
# position relative to fmt/validate. This story does not touch any .tf file
# and does not fix the fmt failure (not this story's call).
# FR29 names only `terraform-cd` and "the deploy" as the things that must
# refuse on a held data-tier lock; it does not ask terraform-cd to refuse on
# a held DEPLOY lock, so this workflow checks `data-tier` only (the deploy
# lock is enforced by the deploy/power scripts themselves, AXI-1951/AXI-1954).
#
# IMPORTANT — these two checks are POINT-IN-TIME READS, not a held lock:
# this workflow never calls `lock.sh ... acquire`, so it holds no lock of
# its own for the duration of `terraform apply`. A `power-data.sh` park
# that starts AFTER apply-production's "Check data-tier lock" step has
# already passed is therefore NOT blocked by this workflow — there is a
# window, between that check and `terraform apply` actually finishing,
# during which a park can still begin. Closing that window means the PARK
# side must itself refuse to proceed while an apply may be running (e.g. by
# acquiring/checking the `deploy` lock, or an equivalent), which is a design
# problem for AXI-1951 to solve, not something this story's read-only check
# can provide on its own.
#
# workflow_dispatch remains for manual plan/apply (plan_only input).
#
# dev/staging images.tfvars commits are EXCLUDED from the push trigger: they do not
# affect the production plan, and dev is deployed separately by dev-auto-promote.yml
# (SSM/SSH). staging is scaffold-only (no live infra), so its manifest commit is a
# record, not a deploy.

name: terraform-cd

on:
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tfvars'
      - 'modules/**'
      - 'environments/**'
      - 'providers/**'
      - 'scripts/**'
      - '.github/workflows/terraform-cd.yml'
      - '.github/actions/export-deploy-credentials/**'
      - '!providers/*/environments/dev/**'
      - '!providers/*/environments/staging/**'
      - '!environments/dev/**'
      - '!environments/staging/**'
  workflow_dispatch:
    inputs:
      plan_only:
        description: 'Plan only (do not apply)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # for tagging prod releases

env:
  TF_VERSION: '1.7'
  TF_IN_AUTOMATION: 'true'

jobs:
  # Infra CI gate — production apply is blocked unless fmt + validate + plan succeed.
  # Mirrors terraform-ci.yml (which only runs on PRs) so push-triggered prod applies
  # get the same validation.
  ci-gate:
    name: Infra CI gate (fmt + validate + plan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -recursive -check -diff

      - name: terraform validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Export provider credentials
        uses: ./.github/actions/export-deploy-credentials
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          neon_api_key: ${{ secrets.NEON_API_KEY }}
          # Exported by the action as TF_VAR_mailjet_* -> providers/aws/modules/secrets
          # -> SSM MAILJET_API_KEY / MAILJET_SECRET_KEY. Empty leaves prod EmailService
          # in its silent log-only fallback (feedback-email incident, 2026-08-26).
          mailjet_api_key: ${{ secrets.MAILJET_API_KEY }}
          mailjet_secret_key: ${{ secrets.MAILJET_SECRET_KEY }}
          # FR35: exported as TF_VAR_guided_analysis_anthropic_api_key -> SSM
          # GUIDED_ANALYSIS_ANTHROPIC_API_KEY (SecureString). Empty = parameter not
          # published and the guided-analysis LLM arm stays unconfigured in prod.
          guided_analysis_anthropic_api_key: ${{ secrets.GUIDED_ANALYSIS_ANTHROPIC_API_KEY }}

      - name: Check data-tier lock (AC20, FR29)
        run: bash scripts/lock.sh production status data-tier

      - name: terraform plan (production)
        env:
          PROVIDER: ${{ vars.PROVIDER || vars.REGISTRY_PROVIDER || 'aws' }}
        run: bash scripts/deploy.sh production --plan-only

  apply-production:
    name: Production (the only live environment — "platform")
    needs: [ci-gate]
    runs-on: ubuntu-latest
    environment: production   # required reviewers => manual approval gate
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Export provider credentials
        uses: ./.github/actions/export-deploy-credentials
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          neon_api_key: ${{ secrets.NEON_API_KEY }}
          # Exported by the action as TF_VAR_mailjet_* -> providers/aws/modules/secrets
          # -> SSM MAILJET_API_KEY / MAILJET_SECRET_KEY. Empty leaves prod EmailService
          # in its silent log-only fallback (feedback-email incident, 2026-08-26).
          mailjet_api_key: ${{ secrets.MAILJET_API_KEY }}
          mailjet_secret_key: ${{ secrets.MAILJET_SECRET_KEY }}
          # FR35: exported as TF_VAR_guided_analysis_anthropic_api_key -> SSM
          # GUIDED_ANALYSIS_ANTHROPIC_API_KEY (SecureString). Empty = parameter not
          # published and the guided-analysis LLM arm stays unconfigured in prod.
          guided_analysis_anthropic_api_key: ${{ secrets.GUIDED_ANALYSIS_ANTHROPIC_API_KEY }}

      # Re-checked here, immediately before apply: ci-gate's check (above)
      # can be minutes/hours stale by the time a human approves the
      # `production` environment's required reviewer gate. UNCHANGED by
      # AXI-1967 — still a point-in-time read of data-tier only (see
      # UT-INFRA-126..128); the new apply lock below is the thing that
      # actually closes the hold-across-apply window (FR42/FR43).
      - name: Check data-tier lock (AC20, FR29)
        run: bash scripts/lock.sh production status data-tier

      # AXI-1967 (FR42/FR43, AC34/AC35): acquire the `apply` lock HERE —
      # the job's first Terraform-affecting step, and crucially AFTER the
      # `environment: production` approval wait above (that wait blocks the
      # whole job before ANY step runs, so acquiring inside a step can
      # never hold the lock across the approval gate). Acquire-then-check
      # (lock_acquire_exclusive, scripts/lock.sh — AXI-1967): take `apply`
      # first, then require `deploy` and `data-tier` both free; on either
      # being held, the helper releases `apply` itself and this step exits
      # non-zero, naming the holder, before `scripts/deploy.sh` ever runs.
      - name: Acquire apply lock (FR42/FR43, AC34)
        shell: bash
        run: |
          set -euo pipefail
          . scripts/lock.sh
          OUT="$(lock_acquire_exclusive production apply "terraform apply run=${{ github.run_id }}" deploy data-tier)"
          echo "$OUT"
          TOKEN="$(printf '%s\n' "$OUT" | sed -n 's/.*token=\([^ ]*\).*/\1/p')"
          echo "APPLY_LOCK_TOKEN=${TOKEN}" >> "$GITHUB_ENV"

      - name: Deploy production
        env:
          PROVIDER: ${{ vars.PROVIDER || vars.REGISTRY_PROVIDER || 'aws' }}
        run: |
          # Apply on push (automatic promotion) and on a normal manual dispatch.
          # Only a manual dispatch with plan_only=true stays plan-only.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.plan_only }}" == "true" ]]; then
            bash scripts/deploy.sh production --plan-only
          else
            bash scripts/deploy.sh production
          fi

      # AXI-1967 (FR42): release `apply` on EVERY outcome of the step above
      # — success, failure, or a cancelled run — never leaving it held. A
      # no-op (never calls lock.sh at all) when the acquire step never
      # captured a token (e.g. it refused and never ran "Deploy production").
      - name: Release apply lock (FR42, always)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APPLY_LOCK_TOKEN:-}" ]; then
            echo "No apply lock token recorded for this run — nothing to release."
            exit 0
          fi
          bash scripts/lock.sh production release apply --token "${APPLY_LOCK_TOKEN}"

      - name: Tag release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.plan_only != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="prod-$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          git tag -a "$TAG" -m "Prod deploy $(date -u '+%Y-%m-%d %H:%M UTC') — run ${{ github.run_id }}"
          git push origin "$TAG"
