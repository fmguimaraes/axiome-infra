# Gated continuous-deployment to PRODUCTION (AXI-1349, FR13/AC17/NFR6; deploy
# ORDERING/ROLLBACK re-architected under AXI-1954, epic AXI-1944, FR14-21/
# EC1/EC13/AC11-14/18/19/28; cross-repo checkouts added under AXI-1968,
# FR45/AC37).
#
# The `deploy` job checks out all three application repositories BESIDE
# axiome-infra (same sibling layout the local dev convention already
# assumes): the repository of the service being deployed is checked out
# AT THE DEPLOYED COMMIT (the image tag resolved to a full SHA via the
# GitHub API — "Resolve deployed commit" below); the other two at their
# default branch. `AXIOME_BACK_PATH` is exported to the deploy step so
# scripts/seed-environment.sh --check (run by deploy-prod.sh) can read its
# expected counts instead of reporting "Baseline verification: NOT
# PERFORMED" (the gap AXI-1954 left open). A missing GH_PAT secret fails
# the job before any AWS credential is configured or any production
# mutation runs.
#
# Closes the promote≠deploy gap: a green `main` build can become a deployed prod
# through a ONE-CLICK approval, without manual ECR surgery. This runs the SAME
# authoritative deploy as `make deploy-prod` (scripts/deploy-prod.sh), which now:
# takes the deploy lock (refusing while held, or while the data-tier lock is
# held/unknown) -> preflights the box (reachable? converted? ledger baselined?)
# -> takes a pre-deploy RDS snapshot ONLY if migrations are pending (production
# only) -> rolls the box to the IMMUTABLE SOURCE TAG, which runs the migration
# gate on the NEW image while the OLD containers still serve -> polls
# `/api/v1/health/ready` -> advances ECR `:stable` ONLY on PASS (the LAST
# mutation) -> runs a read-only baseline verification (warning only) ->
# releases the lock. A failure at any step before `:stable` advances leaves it
# unchanged; a failure after the box's tag was written restores the tag the
# box was serving before this run and proves it, or says plainly that it could
# not (see scripts/deploy-prod.sh's own header for the full sequence).
#
# Triggers (unchanged by AXI-1954 — merging a change to this file or to any
# script it runs does NOT start a run by itself; both triggers below require
# an explicit external action):
#   * repository_dispatch (type: image-published) — the green-build notification
#     axiome-back / axiome-front / axiome-bio-compute each emit via
#     reusable-build.yml (same event dev-auto-promote uses). Covers all three
#     services (AXI-1350/FR14/AC19 widened this from backend-only).
#   * workflow_dispatch — manual one-click deploy of any service + tag.
# There is no `on: push`/`on: pull_request` trigger — a merge to `main` in
# this repo never, by itself, starts a production deploy.
#
# Health path per service — deploy-prod.sh's own HEALTH_URL default is now
# `/api/v1/health/ready` for backend (FR24/FR26/AC18 — a 503 with per-service
# reasons fails the gate and restores the previous tag) on every env's FQDN;
# the "Deploy to production" step below overrides it per NON-backend service
# instead of editing that script (kept generic/reusable as-is): bio-compute ->
# `/api/v1/version`, frontend -> `/` (a static SPA has no health endpoint; a
# 2xx on `/` is the signal), backend keeps the script's own `/health/ready` default.
#
# The GATE: the `deploy` job declares `environment: production`. Configure that as a
# PROTECTED GitHub environment with required reviewers (repo Settings → Environments)
# so every run pauses for one-click human approval before it mutates prod. This
# story does not weaken that gate, any `if:` guard, or any other approval. See the
# runbook + the "Required setup" note at the bottom of this file.
#
# Idempotent + fail-closed (NFR1/NFR2): re-running the same tag after a success
# is a no-op retag + no-op roll; a failed migration or readiness check never
# advances `:stable` and restores the box's previous tag; an SSM-indeterminate
# result never advances `:stable` either (scripts/deploy-prod.sh, FR20). A
# `concurrency` group serializes WORKFLOW runs; the S3 deploy lock inside
# deploy-prod.sh additionally serializes against a laptop `make deploy-prod`
# or a power-down running at the same time (FR28).
#
# Every `run:` step below declares `shell: bash` explicitly and sets
# `set -euo pipefail` itself — a step with no `shell:` key runs `bash -e`
# WITHOUT pipefail, which would hide a failure inside a pipeline silently
# (epic AXI-1944 learning from AXI-1953). Neither step here currently pipes
# into another command, but the declaration is kept so a future edit that
# adds one inherits the safe default rather than a silent one.

name: deploy-production

on:
  repository_dispatch:
    types: [image-published]
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        type: choice
        options: [backend, frontend, biocompute]
        default: backend
        required: true
      tag:
        description: Image tag to promote (8-char git SHA of a green main build)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'eu-west-3' }}

jobs:
  # Resolve trigger inputs and decide whether to proceed BEFORE requesting the
  # (approval-gated) production environment — so an unrecognized/malformed
  # event doesn't raise a needless approval prompt.
  gate:
    name: Resolve & gate
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.resolve.outputs.deploy }}
      service: ${{ steps.resolve.outputs.service }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve service + tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SERVICE="${{ inputs.service }}"
            TAG="${{ inputs.tag }}"
          else
            SERVICE="${{ github.event.client_payload.service }}"
            TAG="${{ github.event.client_payload.image_tag }}"
          fi
          echo "Resolved service='${SERVICE}' tag='${TAG}' (event=${{ github.event_name }})"

          if [ -z "${TAG}" ]; then
            echo "::error::No image tag resolved — cannot deploy."
            exit 1
          fi

          # AXI-1350/AC19 — auto (repository_dispatch) prod CD now covers all
          # three services (was backend-only). Still guard against a
          # malformed/unknown service in the dispatch payload rather than
          # handing deploy-prod.sh a value it will reject anyway.
          case "${SERVICE}" in
            backend|frontend|biocompute) echo "deploy=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Unknown service '${SERVICE}' (event=${{ github.event_name }}) — valid: backend|frontend|biocompute. Skipping."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "service=${SERVICE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ needs.gate.outputs.service }} to production
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # ‼ The one-click approval gate. Make `production` a PROTECTED environment with
    #   required reviewers so this job blocks until a human approves it. AXI-1954
    #   does not weaken this — it only changes what scripts/deploy-prod.sh does
    #   once the run is approved.
    environment: production
    steps:
      - name: Checkout axiome-infra
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: axiome-infra
          persist-credentials: false

      # AXI-1968 (FR45/AC37): the baseline check (scripts/seed-environment.sh
      # --check, run by deploy-prod.sh) reads its expected counts from the
      # axiome-back checkout — without one it is always "NOT PERFORMED"
      # (AXI-1954's own follow-up). This job now checks out all three
      # application repositories beside axiome-infra, same layout the local
      # dev convention already assumes (AXIOME_BACK_PATH's default,
      # `${INFRA_ROOT}/../axiome-back`). Fail BEFORE any production step
      # (AWS creds, lock, deploy-prod.sh) if the credential is missing.
      - name: Verify cross-repo checkout credential is configured
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_PAT:?GH_PAT secret is required to check out axiome-back, axiome-bio-compute and axiome-front for this deploy's baseline check and deployed-commit checkout — missing. Add it as a repo secret (same PAT reusable-build.yml and terraform-cd.yml already use).}"

      # Lead decision (epic AXI-1944 debt-closure pass): the repository of
      # the SERVICE BEING DEPLOYED is checked out at the exact commit the
      # deployed image was built from; the other two repositories at their
      # default branch. The image tag IS that commit's short git SHA
      # (reusable-build.yml: `cut -c1-8` of github.sha) — resolved to a full
      # SHA through the GitHub API (not handed to actions/checkout as-is)
      # so an unresolvable/malformed tag fails here with a truthful message
      # naming the repo and tag, instead of a bare git-fetch error later.
      - name: Resolve deployed commit for ${{ needs.gate.outputs.service }}
        id: resolve-commit
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SERVICE: ${{ needs.gate.outputs.service }}
          TAG: ${{ needs.gate.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          case "${SERVICE}" in
            backend)    REPO="axiome-back" ;;
            biocompute) REPO="axiome-bio-compute" ;;
            frontend)   REPO="axiome-front" ;;
            *)
              echo "::error::Unknown service '${SERVICE}' — cannot resolve its source repository." >&2
              exit 1
              ;;
          esac
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

          # AXI-1968 (Item G, FR63): axiome-infra is already checked out (the
          # very first step in this job), so report.sh's PUBLIC
          # report_is_secret_value is sourceable here too — scrub the API
          # response the same way deploy-prod.sh scrubs its own diagnostic
          # output, rather than printing it unscrubbed just because this is
          # workflow YAML, not a script. GH_PAT itself can never appear in
          # this response (it is sent only in a request HEADER, never
          # reflected by GitHub's API in a commit-lookup response body; no
          # `-v`/`set -x` is used anywhere in this step, so curl's own
          # verbose/trace output — which WOULD echo the Authorization header
          # — is never produced either), but the response body is still
          # untrusted, bounded, and scrubbed defensively before printing.
          # shellcheck disable=SC1091
          . "${GITHUB_WORKSPACE}/axiome-infra/scripts/lib/report.sh"

          response="$(mktemp)"
          http_code="$(curl -sS -o "${response}" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_PAT}" \
            "https://api.github.com/repos/${OWNER}/${REPO}/commits/${TAG}")"

          scrubbed_response() {
            local line out=""
            while IFS= read -r line || [ -n "${line}" ]; do
              if report_is_secret_value "${line}"; then
                out="${out}[response line withheld — matched a secret shape (NFR3); content not printed]"$'\n'
              else
                out="${out}${line}"$'\n'
              fi
            done < <(head -c 2000 "${response}")
            printf '%s' "${out}"
          }

          if [[ ! "${http_code}" =~ ^2 ]]; then
            echo "::error::Could not resolve ${REPO}@${TAG} to a commit via the GitHub API (HTTP ${http_code}) — refusing to check out an unresolved commit for the service being deployed. Nothing was changed. Response (truncated to 2000 bytes, scrubbed): $(scrubbed_response)" >&2
            exit 1
          fi
          sha="$(jq -r '.sha // empty' "${response}")"
          if [[ -z "${sha}" ]]; then
            echo "::error::GitHub API returned no commit SHA for ${REPO}@${TAG} — refusing. Nothing was changed. Response (truncated to 2000 bytes, scrubbed): $(scrubbed_response)" >&2
            exit 1
          fi
          echo "deployed_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${REPO}@${TAG} -> ${sha}"

      - name: Checkout axiome-back (deployed commit)
        if: needs.gate.outputs.service == 'backend'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/axiome-back
          ref: ${{ steps.resolve-commit.outputs.deployed_sha }}
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          path: axiome-back

      - name: Checkout axiome-back (default branch)
        if: needs.gate.outputs.service != 'backend'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/axiome-back
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          path: axiome-back

      - name: Checkout axiome-bio-compute (deployed commit)
        if: needs.gate.outputs.service == 'biocompute'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/axiome-bio-compute
          ref: ${{ steps.resolve-commit.outputs.deployed_sha }}
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          path: axiome-bio-compute

      - name: Checkout axiome-bio-compute (default branch)
        if: needs.gate.outputs.service != 'biocompute'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/axiome-bio-compute
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          path: axiome-bio-compute

      - name: Checkout axiome-front (deployed commit)
        if: needs.gate.outputs.service == 'frontend'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/axiome-front
          ref: ${{ steps.resolve-commit.outputs.deployed_sha }}
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          path: axiome-front

      - name: Checkout axiome-front (default branch)
        if: needs.gate.outputs.service != 'frontend'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/axiome-front
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
          path: axiome-front

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to production (authoritative)
        working-directory: axiome-infra
        env:
          ENV: production
          SERVICE: ${{ needs.gate.outputs.service }}
          TAG: ${{ needs.gate.outputs.tag }}
          # AXI-1968/FR45: scripts/seed-environment.sh --check (run by
          # deploy-prod.sh's read-only baseline step) reads its expected
          # counts from this path instead of guessing a sibling directory.
          AXIOME_BACK_PATH: ${{ github.workspace }}/axiome-back
        shell: bash
        run: |
          # scripts/deploy-prod.sh takes the deploy lock, preflights the box,
          # snapshots only when migrations are pending (production), rolls to
          # the immutable tag (gate runs on the new image while old containers
          # serve), polls /health/ready, advances :stable only on PASS, runs a
          # read-only baseline check, and restores the previous tag on any
          # failure after the roll wrote it. jq + the AWS CLI are preinstalled
          # on ubuntu-latest; ssm-exec.sh uses send-command (no
          # session-manager-plugin needed).
          #
          # AXI-1350/AC19, carried forward under AXI-1954 — deploy-prod.sh's
          # own HEALTH_URL default is now `/api/v1/health/ready` for backend;
          # override it per NON-backend service here (the script itself stays
          # generic/reusable, per its own HEALTH_URL precedence — env var wins
          # over the built-in default).
          set -euo pipefail
          case "${SERVICE}" in
            biocompute) export HEALTH_URL="https://platform.axiomebio.com/api/v1/version" ;;
            frontend)   export HEALTH_URL="https://platform.axiomebio.com/" ;;
            # backend: no override — deploy-prod.sh's own default already
            # resolves https://platform.axiomebio.com/api/v1/health/ready.
          esac
          bash scripts/deploy-prod.sh

      - name: Upload deploy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-report-${{ needs.gate.outputs.service }}-${{ needs.gate.outputs.tag }}
          path: axiome-infra/reports/*-production-deploy-*.md
          if-no-files-found: ignore
          retention-days: 90

# --- Required setup (human-owned; noted as follow-up in AXI-1349) --------------
# 1. Create a PROTECTED GitHub environment named `production` (repo Settings →
#    Environments) with at least one required reviewer — this is the one-click gate.
# 2. Add repo (or environment-scoped) secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#    for an IAM identity allowed to: ECR (DescribeImages/BatchGetImage/PutImage),
#    ssm:SendCommand/GetCommandInvocation/CancelCommand on the prod host, RDS
#    (CreateDBSnapshot/DescribeDBSnapshots/DeleteDBSnapshot — AXI-1954, FR16/FR17,
#    needed only when migrations are pending on production), and S3
#    GetObject/PutObject/DeleteObject on `s3://axiome-production-system/locks/*`
#    (AXI-1947's deploy/data-tier locks, now taken by this workflow's run of
#    deploy-prod.sh — AXI-1954/FR28/FR29).
# 3. Production is powered down by default (cost control). Before approving a run,
#    power it on: `cd providers/aws && make turn-on ENV=production YES=1`. Wiring an
#    automatic power-on/off around the deploy is deferred (touches the data tier).
# 4. (AXI-1350) axiome-front and axiome-bio-compute must each carry the GH_PAT
#    secret used by their reusable-build.yml call so the `image-published`
#    repository_dispatch to this workflow actually fires — same mechanism the
#    backend already relies on (AXI-1349).
# 4a. (AXI-1968) THIS repo's own GH_PAT secret (already used by
#     reusable-build.yml and terraform-cd.yml) must be a PAT with read
#     access to axiome-back, axiome-bio-compute and axiome-front — this
#     job checks out all three (the deployed service at its deployed
#     commit, resolved via the GitHub API; the others at their default
#     branch) so the read-only baseline check actually runs instead of
#     reporting "NOT PERFORMED". Missing GH_PAT fails this job before any
#     AWS credential is configured.
# 5. (AXI-1954, rollout hazard carried from AXI-1949/AXI-1946) Before the FIRST
#    deploy through this re-ordered path: the production box must already have
#    the AXI-1950 one-time asset-sync conversion done, AND user-service's
#    migration ledger must already be baselined (`migrate-gate baseline
#    user-service`, after a read-only check) if it has no ledger today. Without
#    both, the new preflight in scripts/deploy-prod.sh refuses the deploy by
#    design (it names the exact missing act) rather than deploying onto a box
#    the gate cannot reason about. Neither act is run by this workflow or by
#    deploy-prod.sh — both are deliberate, one-off operator acts.
