# Notices a red `main` immediately instead of weeks later. Mirrors
# axiome-back/.github/workflows/ci-failure-alert.yml (AXI-1344) for this repo
# (AXI-2282, epic AXI-2280 CI Robustness, FR8/AC5) — axiome-infra was the only
# service repo with no in-repo red-main alert. When one of the watched
# push-on-`main` workflows finishes on `main` (push), this opens — or comments
# on — a tracking issue labelled `ci-failure`, and closes it again once that
# workflow is green. GitHub emails issue watchers, so a broken main surfaces
# without any external integration. Uses GITHUB_TOKEN for the issue half; the
# Slack half is best-effort on top of a repo secret (see below) and never
# blocking.
#
# Difference from the sibling repos (deliberate): axiome-infra has no single
# chained "CI" workflow — `Secrets Check` and `infra-tests` run nightly on main
# (`schedule`, since 2026-11-20), `terraform-cd` on path-filtered push. So the tracking issue is PER WORKFLOW (its
# name is in the issue title): a green `Secrets Check` must never close the
# issue a red `infra-tests` opened. `timed_out` / `startup_failure` count as
# red too, not only `failure`.
#
# FR9 — this alert runs ON GitHub Actions, so it fails SILENT exactly when
# Actions is unfunded/billing-blocked (the 2026-08-31 → 2026-10-26 incident).
# Its designated backstop for that condition is the out-of-Actions watchdog in
# axiome-global (scripts/hooks/ci_watchdog/, a Claude Code SessionStart hook
# using `gh`), which reports the billing block and stale/absent green `main`.
name: Alert on main CI failure

on:
  workflow_run:
    workflows: ["Secrets Check", "infra-tests", "terraform-cd"]
    types: [completed]

permissions:
  issues: write
  contents: read

jobs:
  main-ci-status:
    # Only the real main pipeline — push runs (terraform-cd) and the nightly
    # `schedule` runs (Secrets Check, infra-tests; cadence switched from
    # per-push to nightly 2026-11-20) — not PR runs, dispatches or other branches.
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - name: Reflect main CI status into a tracking issue + notify Slack
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          # Repo secret (Settings -> Secrets and variables -> Actions).
          # Intentionally optional: an unset secret must degrade to a no-op log
          # line, never fail this job or block the GitHub-issue half.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const label = 'ci-failure';
            const title = `🔴 main CI is failing: ${run.name}`;
            const RED = ['failure', 'timed_out', 'startup_failure'];

            // Best-effort Slack notification. Guard clause / Null Object: when
            // the secret is absent this is a no-op that only logs. A webhook
            // error is logged and swallowed — the issue half is load-bearing.
            async function notifySlack(text) {
              const webhook = process.env.SLACK_WEBHOOK_URL;
              if (!webhook) {
                console.log('SLACK_WEBHOOK_URL is not set — skipping Slack notification (the ci-failure issue still applies).');
                return;
              }
              try {
                const res = await fetch(webhook, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ text }),
                });
                if (!res.ok) {
                  console.log(`Slack webhook responded ${res.status} ${res.statusText} — continuing without failing the workflow.`);
                }
              } catch (err) {
                console.log(`Slack webhook request failed: ${err.message} — continuing without failing the workflow.`);
              }
            }

            // Ensure the label exists (first run in a fresh repo).
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (e) {
              await github.rest.issues.createLabel({
                ...context.repo, name: label, color: 'b60205',
                description: 'The main CI pipeline is currently failing',
              });
            }

            const listed = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label, per_page: 100,
            });
            // Per-workflow tracking: only this workflow's own issue.
            const open = listed.data.filter((iss) => iss.title === title);

            if (RED.includes(run.conclusion)) {
              const body = [
                `**${run.name}** concluded \`${run.conclusion}\` on \`main\`.`,
                ``,
                `- Commit: \`${run.head_sha}\``,
                `- Run: ${run.html_url}`,
                ``,
                `Infrastructure changes on \`main\` are unverified while this is red — fix promptly.`,
              ].join('\n');
              if (open.length > 0) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: open[0].number, body,
                });
              } else {
                await github.rest.issues.create({
                  ...context.repo, title, labels: [label], body,
                });
              }

              const commit = run.head_commit || {};
              const author = commit.author ? commit.author.name : 'unknown';
              await notifySlack(
                [
                  `:red_circle: *${context.repo.owner}/${context.repo.repo}* — *${run.name}* ${run.conclusion} on \`main\``,
                  `Commit: \`${run.head_sha}\` by ${author}`,
                  commit.message ? `Message: ${commit.message.split('\n')[0]}` : null,
                  `Run: ${run.html_url}`,
                ].filter(Boolean).join('\n')
              );
            } else if (run.conclusion === 'success') {
              for (const iss of open) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: iss.number,
                  body: `✅ ${run.name} is green again on main at \`${run.head_sha}\` (${run.html_url}). Closing.`,
                });
                await github.rest.issues.update({
                  ...context.repo, issue_number: iss.number, state: 'closed',
                });
              }

              // Recovery note only when there was something to recover from.
              if (open.length > 0) {
                await notifySlack(
                  `:white_check_mark: *${context.repo.owner}/${context.repo.repo}* — ${run.name} is green again on main at \`${run.head_sha}\` (${run.html_url}).`
                );
              }
            }
