services:
  caddy:
    image: caddy:2-alpine
    container_name: axiome-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
      - frontend
    networks:
      - axiome
    mem_limit: 128m
    cpus: 0.25

  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: axiome-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-axiome}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - axiome
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    mem_limit: 384m
    cpus: 0.5

  redis:
    image: redis:7-alpine
    container_name: axiome-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - axiome
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: 0.25

  # In-region MongoDB-compatible event store (FR3). Active when MONGODB_URL points
  # here (mongodb://...@mongo:27017) instead of Atlas — wired via SSM (secrets).
  mongo:
    image: mongo:7
    container_name: axiome-mongo
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-axiome}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - axiome
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5

  # AXI-1950 (epic AXI-1944 decision 2/3/4, FR10, AC7): one-shot migration gate.
  # `restart: "no"` — a failing gate must not restart-loop; it stays Exited(1)
  # so `docker compose ps` / `logs migrate` shows the operator exactly why the
  # backend containers below never started. No local service dependency: both
  # database URLs point at the external RDS/Neon instance, not a container.
  migrate:
    image: ${ECR_REGISTRY}/axiome/backend:${BACKEND_IMAGE_TAG}
    container_name: axiome-migrate
    restart: "no"
    command: ["migrate-gate", "apply"]
    environment:
      NODE_ENV: production
      ORGANIZATION_DATABASE_URL: ${ORGANIZATION_DATABASE_URL}
      USER_DATABASE_URL: ${USER_DATABASE_URL}
    networks:
      - axiome
    mem_limit: 256m
    cpus: 0.5

  gateway:
    image: ${ECR_REGISTRY}/axiome/backend:${BACKEND_IMAGE_TAG}
    container_name: axiome-gateway
    restart: unless-stopped
    command: ["node", "dist/apps/gateway/main.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-axiome}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      # Defaults to the local container; SSM sets this to the ElastiCache rediss:// URL (FR5).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      BIO_COMPUTE_URL: http://biocompute:8000
      USER_SERVICE_URL: http://user-service:3002
      ORGANIZATION_SERVICE_URL: http://organization-service:3004
      EVENT_SERVICE_URL: http://event-service:3003
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axiome
    # AXI-1950: kept on /health/live (AXI-1949's pure liveness route, no RPC,
    # no dependency on any backing service) — per the AXI-1949 learning,
    # pointing a container healthcheck at /health or /health/ready turns a
    # degraded backing service into a gateway restart-loop.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5

  user-service:
    image: ${ECR_REGISTRY}/axiome/backend:${BACKEND_IMAGE_TAG}
    container_name: axiome-user-service
    restart: unless-stopped
    command: ["node", "dist/apps/user-service/main.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3002"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-axiome}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      USER_DATABASE_URL: ${USER_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - axiome
    # AXI-1950 (FR27/AC18): /health/live is a pure liveness route (AXI-1948)
    # with no database query — a down database must not fail this and trigger
    # a restart loop (AXI-1949 learning). Readiness is covered separately by
    # the gateway's /health/ready, polled by deploy/power-up (AC18), not by
    # this container healthcheck.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 512m
    cpus: 0.5

  organization-service:
    image: ${ECR_REGISTRY}/axiome/backend:${BACKEND_IMAGE_TAG}
    container_name: axiome-organization-service
    restart: unless-stopped
    command: ["node", "dist/apps/organization-service/main.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # AXI-1758: required at boot (live|recorded). Served stacks = live; dev/demo = recorded (CLAUDE.md).
      GUIDED_ANALYSIS_LLM_TRANSPORT: live
      PORT: "3004"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-axiome}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      ORGANIZATION_DATABASE_URL: ${ORGANIZATION_DATABASE_URL}
      S3_REGION: ${S3_REGION}
      S3_BUCKET_ARTIFACTS: ${S3_BUCKET_ARTIFACTS}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS}
      S3_BUCKET_SYSTEM: ${S3_BUCKET_SYSTEM}
      JWT_SECRET: ${JWT_SECRET}
      BIO_COMPUTE_URL: http://biocompute:8000
      CALLBACK_BASE_URL: http://organization-service:3004
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - axiome
    # AXI-1950 (FR27/AC18): organization-service ships no /health/live route
    # (AXI-1948/AXI-1949 only added one to gateway/user-service/event-service).
    # Its /health always returns HTTP 200 even when the body reports
    # 'unhealthy' (no @Res status-code wiring here, unlike the gateway) — so
    # as a container healthcheck this behaves as liveness-only today, same
    # risk profile as /health/live elsewhere. Documented follow-up: it still
    # runs one `SELECT 1` per probe, unlike the zero-cost /health/live used
    # on the other three services.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3004/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 512m
    cpus: 0.5

  event-service:
    image: ${ECR_REGISTRY}/axiome/backend:${BACKEND_IMAGE_TAG}
    container_name: axiome-event-service
    restart: unless-stopped
    command: ["node", "dist/apps/event-service/main.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3003"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-axiome}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      MONGODB_URL: ${MONGODB_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - axiome
    # AXI-1950: /health/live — pure liveness (AXI-1948), no event-store ping.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3003/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 384m
    cpus: 0.5

  biocompute:
    image: ${ECR_REGISTRY}/axiome/biocompute:${BIOCOMPUTE_IMAGE_TAG}
    container_name: axiome-biocompute
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHON_ENV: production
      BIO_COMPUTE_PORT: "8000"
      BIO_COMPUTE_DASHBOARD_DB_URL: ${DATABASE_URL}
      BIO_COMPUTE_JWT_SECRET: ${JWT_SECRET}
      BIO_COMPUTE_S3_BUCKET: ${S3_BUCKET_ARTIFACTS}
    networks:
      - axiome
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1500m
    cpus: 1.5

  frontend:
    image: ${ECR_REGISTRY}/axiome/frontend:${FRONTEND_IMAGE_TAG}
    container_name: axiome-frontend
    restart: unless-stopped
    networks:
      - axiome
    mem_limit: 128m
    cpus: 0.25

volumes:
  caddy_data:
  caddy_config:
  rabbitmq_data:
  redis_data:
  mongo_data:

networks:
  axiome:
    driver: bridge
    name: axiome-deploy
